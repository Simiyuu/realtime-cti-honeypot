services:
  mysql:
    image: mysql:8.4
    container_name: honeypot-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - honeypot_mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  honeypot_mysql_data:
  